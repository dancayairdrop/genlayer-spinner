<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48"
     role="status" aria-label="Loading" style="color:#110FFF">
  <title>Loading…</title>

  <style>
    :root { --gl-spinner-color: currentColor; }

    .gl-wheel {
      transform-box: view-box;
      transform-origin: 50% 50%;
      animation: gl-spin 1.8s linear infinite;
    }

    .gl-core {
      fill: var(--gl-spinner-color);
      transform-box: view-box;
      transform-origin: 50% 50%;
      filter: drop-shadow(0 0 3px currentColor);
      animation: gl-pulse-core 2.4s ease-in-out infinite;
    }

    .gl-node {
      fill: var(--gl-spinner-color);
      filter: drop-shadow(0 0 2px currentColor);
      animation: gl-pulse-node 1.8s ease-in-out infinite;
    }

    .gl-node-a { animation-delay: 0s;    }
    .gl-node-b { animation-delay: -0.6s; }
    .gl-node-c { animation-delay: -1.2s; }

    @keyframes gl-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes gl-pulse-core {
      0%, 100% { transform: scale(1);     opacity: .8;  }
      50%      { transform: scale(1.14);  opacity: 1;   }
    }

    @keyframes gl-pulse-node {
      0%, 100% { opacity: .3; }
      50%      { opacity: 1;  }
    }

    /* keep the loop legible for motion-sensitive users without killing the
       "still loading" signal a spinner exists to give */
    @media (prefers-reduced-motion: reduce) {
      .gl-wheel  { animation-duration: 3.2s; }
      .gl-core,
      .gl-node   { animation-duration: 3.2s; }
    }
  </style>

  <!-- three orbiting validator nodes reaching consensus around a fixed core -->
  <g class="gl-wheel">
    <g transform="rotate(0 50 50)">
      <path class="gl-node gl-node-a" d="M50 19 L56 26 L50 33 L44 26 Z"/>
    </g>
    <g transform="rotate(120 50 50)">
      <path class="gl-node gl-node-b" d="M50 19 L56 26 L50 33 L44 26 Z"/>
    </g>
    <g transform="rotate(240 50 50)">
      <path class="gl-node gl-node-c" d="M50 19 L56 26 L50 33 L44 26 Z"/>
    </g>
  </g>

  <!-- static, breathing core: the "adjudication" anchor everything orbits -->
  <path class="gl-core" d="M50 41 L59 50 L50 59 L41 50 Z"/>
</svg>
